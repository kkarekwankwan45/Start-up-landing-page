<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaleWonder - ติดต่อเรา</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #fff6e5 0%, #fffdf9 45%, #fffdf9 100%);
            color: #2d3436;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            scroll-behavior: smooth;
        }

        /* Header / Navigation Bar (สไตล์เดียวกับ Navbar ใน index.html) */
        header {
            background-color: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 14px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .logo-icon {
            color: #dc3545;
            font-size: 1.5rem;
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #dc3545;
            letter-spacing: 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        nav ul li a {
            text-decoration: none;
            color: rgba(0, 0, 0, 0.65);
            font-weight: 400;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        nav ul li a:hover, nav ul li a.active {
            color: #dc3545;
            font-weight: 500;
        }

        .nav-btn {
            background-color: #ff6b6b;
            border: 1px solid #ff6b6b;
            color: #ffffff !important;
            padding: 8px 20px;
            border-radius: 50rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background-color: #ee5253;
            border-color: #ee5253;
            transform: translateY(-2px);
        }

        /* Main Content (การ์ดขอบมน เงาละมุนเหมือนการ์ดใน index.html) */
        .main-content {
            flex: 1;
            max-width: 800px;
            width: 90%;
            margin: 60px auto;
            background: #ffffff;
            padding: 45px;
            border-radius: 24px;
            border: 4px solid #ffffff;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08);
        }

        .contact-title {
            font-size: 2rem;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
        }

        .contact-title::after {
            content: "";
            display: block;
            width: 60px;
            height: 4px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            border-radius: 50rem;
            margin: 10px auto 0;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: #2d3436;
            font-size: 0.95rem;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dee2e6;
            border-radius: 14px;
            font-size: 0.95rem;
            color: #2d3436;
            outline: none;
            transition: all 0.3s ease;
            background-color: #fffdf9;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #ff6b6b;
            background-color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(255, 107, 107, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 140px;
        }

        /* ปุ่ม Submit สไตล์เดียวกับ .btn-brand ใน index.html */
        .submit-btn {
            background-color: #ff6b6b;
            border: 1px solid #ff6b6b;
            color: #ffffff;
            font-weight: 600;
            padding: 12px 42px;
            border-radius: 50rem;
            cursor: pointer;
            font-size: 1.05rem;
            margin: 10px auto 0 auto;
            transition: all 0.3s ease;
            box-shadow: 0 0.25rem 0.75rem rgba(255, 107, 107, 0.35);
        }

        .submit-btn:hover {
            background-color: #ee5253;
            border-color: #ee5253;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Contact Information Section (โทนสี #fff6e5 และไอคอน .feature-icon จาก index.html) */
        .contact-info-section {
            margin-top: 45px;
            padding: 30px 25px;
            background-color: #fff6e5;
            border-radius: 20px;
            text-align: center;
        }

        .contact-info-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 22px;
        }

        .info-items {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 24px;
            font-size: 0.92rem;
            color: #6c757d;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #ffffff;
            padding: 10px 18px;
            border-radius: 50rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.05);
        }

        .info-item i {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background-color: #fff0f0;
            color: #ff6b6b;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        /* Footer (โทน bg-dark #212529 และปุ่ม .social-icon เหมือน index.html) */
        footer {
            background-color: #212529;
            text-align: center;
            padding: 40px 20px;
            font-size: 0.9rem;
            color: #6c757d;
            border-top: none;
            margin-top: auto;
        }

        footer p {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            color: #adb5bd;
        }

        .social-links {
            display: inline-flex;
            gap: 10px;
            margin-left: 5px;
        }

        .social-links a {
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-links a:hover {
            background-color: #ff6b6b;
            color: #ffffff;
            transform: translateY(-3px);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 12px;
                padding: 15px 5%;
            }
            nav ul {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .main-content {
                padding: 25px 20px;
                margin: 30px auto;
            }
            .info-items {
                flex-direction: column;
                gap: 12px;
            }
            .info-item {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Navigation (เพิ่มเมนูติดต่อเรา และ ค้นหานิทาน) -->
    <header>
        <a href="index.html" class="logo-container">
            <span class="logo-icon">✨</span>
            <span class="brand-name">TaleWonder</span>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">หน้าแรก</a></li>
                <li><a href="Shoptale.html">ร้านค้านิทาน</a></li>
                <li><a href="team-member.html">เกี่ยวกับเรา</a></li>
                <li><a href="Contact.html" class="active">ติดต่อเรา</a></li>
             
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <div class="main-content">
        <h2 class="contact-title">Contact Us </h2>
        
        <form class="contact-form" action="#" method="POST">
            <div class="form-group">
                <label for="name">Name (ชื่อของคุณ):</label>
                <input type="text" id="name" name="name" placeholder="กรอกชื่อ-นามสกุลของคุณ" required>
            </div>

            <div class="form-group">
                <label for="email">Email (อีเมล):</label>
                <input type="email" id="email" name="email" placeholder="contact.talewonder@example.com" required>
            </div>

            <div class="form-group">
                <label for="message">Your Message (ข้อความของคุณ):</label>
                <textarea id="message" name="message" placeholder="พิมพ์ข้อความหรือสอบถามรายละเอียดเกี่ยวกับนิทานได้ที่นี่..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit </button>
        </form>

        <!-- Contact Information (ข้อมูลติดต่อแบบจำลอง) -->
        <div class="contact-info-section">
            <h3 class="contact-info-title">ช่องทางการติดต่ออื่นๆ</h3>
            <div class="info-items">
                <div class="info-item">
                    <i class="fa-solid fa-envelope"></i>
                    <span>support@talewonder.mock</span>
                </div>
                <div class="info-item">
                    <i class="fa-solid fa-phone"></i>
                    <span>02-xxx-xxxx</span>
                </div>
                <div class="info-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>123 ถนนนิทานมหัศจรรย์ กรุงเทพฯ 10100</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
            <p class="small text-secondary mb-0">
                &copy; 2026 TaleWonder Studio Co., Ltd. All Rights Reserved. | TaleWonder Group • CAI 
            </p>
    </footer>
</body>
</html>
